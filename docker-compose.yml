services:
  db:
    image: postgres:16-alpine
    container_name: agrovalle-postgres
    environment:
      POSTGRES_DB: agrovalle_connect
      POSTGRES_USER: agrovalle
      POSTGRES_PASSWORD: agrovalle
    ports:
      - "5432:5432"
    volumes:
      - agrovalle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovalle -d agrovalle_connect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agrovalle-postgres-data:
