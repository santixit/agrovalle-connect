spring.application.name=agrovalle-connect
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrovalle_connect}
spring.datasource.username=${DB_USERNAME:agrovalle}
spring.datasource.password=${DB_PASSWORD:agrovalle}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:}
