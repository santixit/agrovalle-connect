<section id="carrito-seccion" hidden aria-labelledby="carrito-titulo">
      <h2 id="carrito-titulo">Mi carrito de compra</h2>
      <p class="section-intro">Revisa cantidades antes de enviar tus reservas a los agricultores.</p>
      <div id="carrito-lineas" class="row"></div>
      <p id="carrito-vacio" class="empty-state">Tu carrito está vacío. Agrega una cosecha desde el catálogo.</p>
      <div class="actions">
        <button type="button" id="confirmar-carrito">Enviar reservas</button>
        <button type="button" id="vaciar-carrito" class="secondary">Vaciar carrito</button>
      </div>
      <p id="carrito-status" class="status" role="status"></p>
    </section>
