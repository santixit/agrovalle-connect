name: Continuous Integration
run-name: AgroValle Connect - CI (${{ github.event_name }} | ${{ github.ref_name }})

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, tests, Checkstyle and JaCoCo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrovalle_connect
          POSTGRES_USER: agrovalle
          POSTGRES_PASSWORD: agrovalle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrovalle -d agrovalle_connect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v7
      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, tests and Checkstyle
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Configure Node.js for browser E2E
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run critical marketplace browser flow
        run: npm run test:e2e
      - name: Save JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  deploy-staging:
    name: Deploy to staging
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      triggered: ${{ steps.trigger.outputs.triggered }}
    steps:
      - name: Trigger staging deployment
        id: trigger
        env:
          STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$STAGING_DEPLOY_HOOK" ]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            echo "STAGING_DEPLOY_HOOK is not configured; staging deployment was skipped."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --max-time 30 --request POST "$STAGING_DEPLOY_HOOK"
          echo "triggered=true" >> "$GITHUB_OUTPUT"

  verify-staging:
    name: Verify staging database
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-staging.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Check staging configuration without printing credentials
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_DB_USERNAME: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [ -z "$STAGING_DB_URL" ] || [ -z "$STAGING_DB_USERNAME" ] || [ -z "$STAGING_DB_PASSWORD" ]; then
            echo "Configure STAGING_DB_URL, STAGING_DB_USER, and STAGING_DB_PASSWORD in repository or staging environment secrets."
            exit 1
          fi
      - name: Wait for the staging application to be ready
        run: |
          health_url="https://agrovalle-connect-staging.onrender.com/api/v1/health"
          for attempt in $(seq 1 36); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$health_url" || true)
            if [ "$status" = "200" ]; then
              echo "Staging is ready; Flyway completed during application startup."
              exit 0
            fi
            echo "Waiting for staging readiness (attempt $attempt/36; HTTP $status)."
            sleep 5
          done
          echo "Staging did not become ready within six minutes."
          exit 1
      - name: Verify database name, Flyway version, and core tables
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_DB_USERNAME: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          for attempt in $(seq 1 30); do
            if mvn --batch-mode --no-transfer-progress -Dtest=StagingDatabaseSmokeTest test; then
              echo "Staging database passed the Flyway and table checks."
              exit 0
            fi
            echo "Waiting for the deployment to apply Flyway migrations (attempt $attempt/30)."
            sleep 10
          done
          echo "Staging database did not reach Flyway version 7 within five minutes."
          exit 1
